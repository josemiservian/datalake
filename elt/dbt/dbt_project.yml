name: 'transformations'
version: '1.0.0'

profile: 'trino'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  initial_load_date: "2022-01-01"

# The top-level key must match `name` above, otherwise dbt ignores the block.
# Schemas are used verbatim (see macros/generate_schema_name.sql).
models:
  transformations:
    silver:
      +schema: silver
    gold:
      +schema: gold
